<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Sign Up - Cyber Shield</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
  <div class="cs-card" style="width: 100%; max-width: 460px; padding: 36px 30px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <span class="cs-brand-icon" style="width: 48px; height: 48px; font-size: 24px; margin: 0 auto 12px; display: flex;">🛡️</span>
      <h2 style="font-size: 1.5rem; font-weight: 700;">Create Account</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 4px;">Join the Cyber Shield Defense Network</p>
    </div>
    
    <form action="/signup" method="GET">
      <div class="cs-form-group" style="margin-bottom: 14px;">
        <label class="cs-label" for="user">Username</label>
        <input class="cs-input" type="text" name="user" id="user" placeholder="Username" required />
      </div>

      <div class="cs-form-group" style="margin-bottom: 14px;">
        <label class="cs-label" for="name">Full Name</label>
        <input class="cs-input" type="text" name="name" id="name" placeholder="Full Name" required />
      </div>

      <div class="cs-form-group" style="margin-bottom: 14px;">
        <label class="cs-label" for="email">Email</label>
        <input class="cs-input" type="email" name="email" id="email" placeholder="name@example.com" required />
      </div>

      <div class="cs-form-group" style="margin-bottom: 14px;">
        <label class="cs-label" for="mobile">Mobile Number</label>
        <input class="cs-input" type="text" name="mobile" id="mobile" placeholder="Mobile Number" required />
      </div>

      <div class="cs-form-group" style="margin-bottom: 24px;">
        <label class="cs-label" for="password">Password</label>
        <input class="cs-input" type="password" name="password" id="password" placeholder="Password" required />
      </div>

      <button type="submit" class="cs-btn cs-btn-primary" style="width: 100%; justify-content: center;">
        Sign Up &rarr;
      </button>

      <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-secondary);">
        Already have an account? <a href="/login" style="color: var(--accent-blue); text-decoration: none; font-weight: 600;">Sign In</a>
      </div>
    </form>
  </div>
</body>
</html>
